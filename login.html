<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var s=localStorage.getItem('jobtrack-auth');
    var role=localStorage.getItem('jt_role');
    if(!s||!role)return;
    var t=JSON.parse(s);
    if(!t||!t.access_token)return;
    window.location.replace(role==='admin'?'index.html':'my-tasks.html');
  }catch(e){}
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobTrack — Sign in</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a18;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.07)}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px;text-align:center;margin-bottom:.5rem}
.logo span{color:#185FA5}
.subtitle{text-align:center;font-size:14px;color:#6b6a65;margin-bottom:2rem}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:#6b6a65;margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid #c8c7c0;border-radius:8px;font-size:15px;outline:none;font-family:inherit;color:#1a1a18;background:#fff}
.field input:focus{border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.sign-btn{width:100%;height:44px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.sign-btn:hover{background:#0C447C}
.sign-btn:disabled{background:#aaa;cursor:not-allowed}
.err{background:#FCEBEB;color:#791F1F;border:1px solid #F7C1C1;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
.err.show{display:block}
.footer{text-align:center;font-size:12px;color:#aaa;margin-top:1.5rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Job<span>Track</span></div>
  <div class="subtitle">Sign in to your account</div>
  <div class="err" id="err"></div>
  <div class="field">
    <label>Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')signIn()">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
  </div>
  <button class="sign-btn" id="sign-btn" onclick="signIn()">Sign in</button>
  <div class="footer">Contact your administrator to reset your password.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script>
document.getElementById('email').focus();

async function signIn(){
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('sign-btn');
  clearErr();
  if(!email||!password){ showErr('Please enter your email and password.'); return; }
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const {data, error} = await db.auth.signInWithPassword({email, password});
  if(error){
    showErr(error.message.includes('Invalid login credentials')
      ? 'Incorrect email or password.' : error.message);
    btn.disabled = false;
    btn.textContent = 'Sign in';
    return;
  }

  // Fetch role and cache it in localStorage so sync guard works instantly next time
  const {data: profile} = await db
    .from('jt_user_profiles')
    .select('role')
    .eq('id', data.user.id)
    .single();

  const role = profile?.role || 'drafter';
  localStorage.setItem('jt_role', role);  // cache for instant sync guard
  window.location.replace(role === 'admin' ? 'index.html' : 'my-tasks.html');
}

function showErr(msg){ document.getElementById('err').textContent=msg; document.getElementById('err').className='err show'; }
function clearErr(){ document.getElementById('err').className='err'; }
</script>
</body>
</html>
