<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonus Electric — Sign in</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a18;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.07)}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px;text-align:center;margin-bottom:.4rem}.logo span{color:#C41230}
.subtitle{text-align:center;font-size:14px;color:#6b6a65;margin-bottom:2rem}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:#6b6a65;margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid #c8c7c0;border-radius:8px;font-size:15px;outline:none;font-family:inherit;color:#1a1a18;background:#fff;transition:border .15s}
.field input:focus{border-color:#C41230;box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.btn{width:100%;height:44px;background:#C41230;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.btn:hover{background:#3D0A14}.btn:disabled{background:#9ab8d8;cursor:not-allowed}
.err{background:#FCEBEB;color:#791F1F;border:1px solid #F7C1C1;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
.err.show{display:block}
.footer{text-align:center;font-size:12px;color:#aaa;margin-top:1.5rem}
.debug{background:#f5f5f2;border:1px solid #e0dfd8;border-radius:6px;padding:8px 10px;font-size:11px;color:#6b6a65;margin-top:1rem;font-family:monospace;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.jpg" alt="Bonus Electric & Technology Solutions" style="height:38px;width:auto;object-fit:contain;display:block"></div>
  <div class="subtitle">Sign in to your account</div>
  <div class="err" id="err"></div>
  <div class="field">
    <label>Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="sign-btn" onclick="signIn()">Sign in</button>
  <div class="footer">Contact your administrator to reset your password.</div>
  <div class="debug" id="debug"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script>
// Clear any stale cached role/session on login page load
// This prevents ghost sessions from causing bypasses
localStorage.removeItem('jt_role');

document.getElementById('email').focus();
document.addEventListener('keydown', e => { if(e.key==='Enter') signIn(); });

function dbg(msg) {
  const el = document.getElementById('debug');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  console.log('[JobTrack]', msg);
}

async function signIn(){
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('sign-btn');
  clearErr();

  if(!email || !password){ showErr('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    // Step 1: Sign in with Supabase Auth
    dbg('Attempting sign in...');
    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if(error){
      dbg('Auth error: ' + error.message);
      showErr(error.message.includes('Invalid login credentials')
        ? 'Incorrect email or password.'
        : 'Sign in failed: ' + error.message);
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    dbg('Auth OK, user: ' + data.user.id);

    // Step 2: Fetch role from jt_user_profiles
    const { data: profile, error: perr } = await db
      .from('jt_user_profiles')
      .select('role, drafter_name')
      .eq('id', data.user.id)
      .single();

    if(perr || !profile){
      dbg('Profile error: ' + (perr?.message || 'no profile found'));
      showErr('Your account is not set up yet. Contact your administrator. (No profile found for ' + email + ')');
      await db.auth.signOut();
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    dbg('Profile OK, role: ' + profile.role);

    // Step 3: Cache role and redirect
    localStorage.setItem('jt_role', profile.role);
    const dest = profile.role === 'admin' ? 'index.html' : profile.role === 'viewer' ? 'viewer-dashboard.html' : 'my-tasks.html';
    dbg('Redirecting to: ' + dest);
    window.location.replace(dest);

  } catch(e) {
    dbg('Unexpected error: ' + e.message);
    showErr('Unexpected error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

function showErr(msg){ const e=document.getElementById('err'); e.textContent=msg; e.className='err show'; }
function clearErr(){ document.getElementById('err').className='err'; }
</script>
</body>
</html>
