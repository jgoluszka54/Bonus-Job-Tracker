<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTrack — Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a18;min-height:100vh;font-size:15px}
header{background:#fff;border-bottom:1px solid #e0dfd8;padding:0.85rem 1.5rem;display:flex;align-items:center;gap:1.5rem;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-size:19px;font-weight:700;letter-spacing:-0.4px;white-space:nowrap;margin-right:0.5rem}
.logo span{color:#185FA5}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav-a{padding:6px 14px;border-radius:6px;font-size:14px;text-decoration:none;color:#6b6a65;font-weight:500;transition:all 0.1s;white-space:nowrap}
.nav-a:hover{background:#f0efe8;color:#1a1a18}
.nav-a.active{background:#E6F1FB;color:#0C447C}
main{padding:1.25rem 1.5rem;max-width:1400px}

/* Calendar nav */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.cal-nav h2{font-size:20px;font-weight:600;flex:1;min-width:160px}
.btn{height:34px;padding:0 13px;border-radius:6px;border:1px solid #c8c7c0;background:#fff;color:#1a1a18;font-size:14px;cursor:pointer;white-space:nowrap;transition:background 0.12s}
.btn:hover{background:#f0efe8}
.btn.primary{background:#185FA5;color:#fff;border-color:#185FA5}
.btn.primary:hover{background:#0C447C}
.btn.active-view{background:#E6F1FB;color:#0C447C;border-color:#B5D4F4}
select.filter{font-size:13px;height:34px;padding:0 9px;border:1px solid #c8c7c0;border-radius:6px;background:#fff;color:#1a1a18;outline:none}
select.filter:focus{border-color:#185FA5}

/* Legend */
.legend{display:flex;gap:16px;margin-bottom:1rem;flex-wrap:wrap;font-size:12px;color:#6b6a65;align-items:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* Month grid */
.cal-grid{background:#fff;border:1px solid #e0dfd8;border-radius:12px;overflow:hidden}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#f5f5f2;border-bottom:1px solid #e0dfd8}
.cal-weekday{padding:8px;text-align:center;font-size:12px;font-weight:500;color:#6b6a65;text-transform:uppercase;letter-spacing:0.4px}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:110px;border-right:1px solid #f0efe8;border-bottom:1px solid #f0efe8;padding:6px;vertical-align:top;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other-month{background:#fafaf8}
.cal-cell.today{background:#EBF4FF}
.cal-cell.today .day-num{background:#185FA5;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.day-num{font-size:13px;font-weight:500;color:#6b6a65;margin-bottom:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-cell.today .day-num{color:#fff}
.other-month .day-num{color:#c8c7c0}

/* Events */
.cal-event{font-size:11px;padding:2px 5px;border-radius:3px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;transition:opacity 0.1s}
.cal-event:hover{opacity:0.8}
.ev-design{background:#EEEDFE;color:#3C3489}
.ev-draft{background:#E6F1FB;color:#0C447C}
.ev-issue{background:#EAF3DE;color:#27500A}
.ev-task{background:#FAEEDA;color:#633806}
.ev-over{background:#FCEBEB;color:#791F1F}
.more-events{font-size:11px;color:#6b6a65;cursor:pointer;padding:1px 5px}
.more-events:hover{color:#185FA5}

/* List view */
.list-section{margin-bottom:1.5rem}
.list-month-title{font-size:14px;font-weight:600;color:#6b6a65;margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid #e0dfd8;text-transform:uppercase;letter-spacing:0.5px}
.list-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f5f5f2;font-size:14px}
.list-row:last-child{border-bottom:none}
.list-date{width:70px;font-size:13px;font-weight:500;color:#1a1a18;flex-shrink:0}
.list-date.over{color:#A32D2D}
.list-date.soon{color:#854F0B}
.list-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.list-info{flex:1;min-width:0}
.list-label{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:#6b6a65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;font-weight:500;white-space:nowrap}
.b-active{background:#E6F1FB;color:#0C447C}
.b-review{background:#FAEEDA;color:#633806}
.b-complete{background:#EAF3DE;color:#27500A}
.b-onhold{background:#F1EFE8;color:#444441}
.b-cancelled{background:#FCEBEB;color:#791F1F}
.t-todo{background:#F1EFE8;color:#444441}
.t-inprog{background:#E6F1FB;color:#0C447C}
.t-done{background:#EAF3DE;color:#27500A}
.t-blocked{background:#FCEBEB;color:#791F1F}

/* Day detail popover */
.day-popover{display:none;position:fixed;background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1rem;min-width:260px;max-width:320px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.12)}
.day-popover.open{display:block}
.pop-title{font-weight:600;font-size:15px;margin-bottom:0.75rem;display:flex;justify-content:space-between;align-items:center}
.pop-close{background:none;border:none;cursor:pointer;font-size:18px;color:#6b6a65;line-height:1}
.pop-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f2;font-size:13px}
.pop-item:last-child{border-bottom:none}
.pop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.pop-info{flex:1;min-width:0}
.pop-label{font-weight:500}
.pop-sub{font-size:12px;color:#6b6a65}
.empty{text-align:center;padding:3rem;color:#6b6a65}
</style>
</head>
<body>
<header>
  <div class="logo">Job<span>Track</span></div>
  <nav>
    <a href="index.html" class="nav-a">Projects</a>
    <a href="tasks.html" class="nav-a">Tasks</a>
    <a href="calendar.html" class="nav-a active">Calendar</a>
    <a href="dashboard.html" class="nav-a">Dashboard</a>
  </nav>
</header>

<main>
  <div class="cal-nav">
    <button class="btn" onclick="prevMonth()">&#8592;</button>
    <h2 id="cal-title"></h2>
    <button class="btn" onclick="nextMonth()">&#8594;</button>
    <button class="btn primary" onclick="goToday()">Today</button>
    <button class="btn" id="btn-month" onclick="setView('month')">Month</button>
    <button class="btn" id="btn-list" onclick="setView('list')">List</button>
    <select class="filter" id="f-drafter"><option value="">All drafters</option></select>
    <select class="filter" id="f-type">
      <option value="">All types</option>
      <option value="design">Design due</option>
      <option value="draft">Draft due</option>
      <option value="issue">Issue date</option>
      <option value="task">Tasks</option>
    </select>
  </div>

  <div class="legend">
    <span style="font-weight:500;color:#1a1a18">Legend:</span>
    <span class="legend-item"><span class="legend-dot" style="background:#7F77DD"></span>Design due</span>
    <span class="legend-item"><span class="legend-dot" style="background:#378ADD"></span>Draft due</span>
    <span class="legend-item"><span class="legend-dot" style="background:#639922"></span>Issue date</span>
    <span class="legend-item"><span class="legend-dot" style="background:#BA7517"></span>Task due</span>
    <span class="legend-item"><span class="legend-dot" style="background:#E24B4A"></span>Overdue</span>
  </div>

  <div id="cal-output"></div>
</main>

<!-- Day detail popover -->
<div class="day-popover" id="day-pop">
  <div class="pop-title"><span id="pop-date-title"></span><button class="pop-close" onclick="closePop()">✕</button></div>
  <div id="pop-items"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script>
const SC={Active:'b-active','In review':'b-review',Complete:'b-complete','On hold':'b-onhold',Cancelled:'b-cancelled'};
const TC={'To do':'t-todo','In progress':'t-inprog','Done':'t-done','Blocked':'t-blocked'};

let jobs=JSON.parse(localStorage.getItem('jt_jobs')||'[]');
let drafters=JSON.parse(localStorage.getItem('jt_drafters')||'[]');
let tasks=JSON.parse(localStorage.getItem('jt_tasks')||'[]');

let viewMode='month';
let curYear=new Date().getFullYear();
let curMonth=new Date().getMonth(); // 0-based

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// Populate drafter filter
['f-drafter','f-type'].forEach(id=>document.getElementById(id).addEventListener('change',renderCal));

function prevMonth(){curMonth--;if(curMonth<0){curMonth=11;curYear--;}renderCal();}
function nextMonth(){curMonth++;if(curMonth>11){curMonth=0;curYear++;}renderCal();}
function goToday(){const n=new Date();curYear=n.getFullYear();curMonth=n.getMonth();renderCal();}
function setView(v){viewMode=v;document.getElementById('btn-month').className='btn'+(v==='month'?' active-view':'');document.getElementById('btn-list').className='btn'+(v==='list'?' active-view':'');renderCal();}

function getFilteredDrafter(){return document.getElementById('f-drafter').value;}
function getFilteredType(){return document.getElementById('f-type').value;}

// Build all calendar events from jobs and tasks
function buildEvents(){
  const fd=getFilteredDrafter();
  const ft=getFilteredType();
  const today=new Date();today.setHours(0,0,0,0);
  const events=[];

  jobs.forEach(j=>{
    if(fd&&j.drafter!==fd)return;
    if(j.status==='Cancelled')return;
    const isComplete=j.status==='Complete';
    const label=`${j.job_no} — ${j.client}`;
    const sub=j.drafter||'Unassigned';

    if((!ft||ft==='design')&&j.due_design){
      const d=new Date(j.due_design+'T00:00:00');
      const over=!isComplete&&d<today;
      events.push({date:j.due_design,type:'design',over,label,sub,typeLabel:'Design due',job:j});
    }
    if((!ft||ft==='draft')&&j.due_draft){
      const d=new Date(j.due_draft+'T00:00:00');
      const over=!isComplete&&d<today;
      events.push({date:j.due_draft,type:'draft',over,label,sub,typeLabel:'Draft due',job:j});
    }
    if((!ft||ft==='issue')&&j.due_issue){
      const d=new Date(j.due_issue+'T00:00:00');
      const over=!isComplete&&d<today;
      events.push({date:j.due_issue,type:'issue',over,label,sub,typeLabel:'Issue date',job:j});
    }
  });

  if(!ft||ft==='task'){
    tasks.forEach(t=>{
      if(!t.due)return;
      const job=jobs.find(j=>j.id===t.job_id)||{};
      if(fd&&job.drafter!==fd)return;
      if(t.status==='Done')return;
      const d=new Date(t.due+'T00:00:00');
      const over=d<today;
      events.push({date:t.due,type:'task',over,label:t.name,sub:`${job.jobNo||'?'} — ${job.client||''}`,typeLabel:'Task',task:t,job});
    });
  }

  return events;
}

const EV_CLS={design:'ev-design',draft:'ev-draft',issue:'ev-issue',task:'ev-task'};
const EV_DOT={design:'#7F77DD',draft:'#378ADD',issue:'#639922',task:'#BA7517'};

function renderCal(){
  document.getElementById('cal-title').textContent=`${MONTHS[curMonth]} ${curYear}`;
  document.getElementById('btn-month').className='btn'+(viewMode==='month'?' active-view':'');
  document.getElementById('btn-list').className='btn'+(viewMode==='list'?' active-view':'');
  if(viewMode==='month')renderMonth();else renderList();
}

function renderMonth(){
  const events=buildEvents();
  // Build map: date-string -> events[]
  const evMap={};
  events.forEach(e=>{evMap[e.date]=(evMap[e.date]||[]).concat(e);});

  const firstDay=new Date(curYear,curMonth,1).getDay();
  const daysInMonth=new Date(curYear,curMonth+1,0).getDate();
  const prevDays=new Date(curYear,curMonth,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);

  let cells='';
  // Leading blanks
  for(let i=firstDay-1;i>=0;i--){
    const d=prevDays-i;
    const mo=curMonth===0?curYear-1:curYear;
    const mn=curMonth===0?12:curMonth;
    const ds=`${mo}-${String(mn).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=`<div class="cal-cell other-month"><div class="day-num">${d}</div></div>`;
  }
  // Current month days
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const dayEvs=evMap[ds]||[];
    const SHOW=3;
    const shown=dayEvs.slice(0,SHOW);
    const extra=dayEvs.length-SHOW;
    const evHtml=shown.map(e=>{
      const cls=e.over?'cal-event ev-over':`cal-event ${EV_CLS[e.type]||'ev-task'}`;
      return`<div class="${cls}" onclick="showPop('${ds}',event)" title="${e.label}">${e.label}</div>`;
    }).join('');
    const moreHtml=extra>0?`<div class="more-events" onclick="showPop('${ds}',event)">+${extra} more</div>`:'';
    cells+=`<div class="cal-cell${isToday?' today':''}"><div class="day-num">${d}</div>${evHtml}${moreHtml}</div>`;
  }
  // Trailing blanks
  const total=firstDay+daysInMonth;
  const trail=(7-total%7)%7;
  for(let d=1;d<=trail;d++){
    cells+=`<div class="cal-cell other-month"><div class="day-num">${d}</div></div>`;
  }

  document.getElementById('cal-output').innerHTML=`
    <div class="cal-grid">
      <div class="cal-weekdays">${WDAYS.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
      <div class="cal-days">${cells}</div>
    </div>`;
}

function renderList(){
  const events=buildEvents();
  const today=new Date();today.setHours(0,0,0,0);
  // Show current month + 3 months ahead + overdue
  const cutoff=new Date(curYear,curMonth+4,0);

  const overdue=events.filter(e=>new Date(e.date+'T00:00:00')<today).sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming=events.filter(e=>{const d=new Date(e.date+'T00:00:00');return d>=today&&d<=cutoff;}).sort((a,b)=>a.date.localeCompare(b.date));

  if(!overdue.length&&!upcoming.length){
    document.getElementById('cal-output').innerHTML='<div class="empty">No due dates found for the current filters.</div>';return;
  }

  let html='';
  if(overdue.length){
    html+=`<div class="list-section"><div class="list-month-title" style="color:#A32D2D">Overdue (${overdue.length})</div>`;
    html+=overdue.map(e=>listRow(e,true)).join('');
    html+='</div>';
  }

  // Group upcoming by month
  const byMonth={};
  upcoming.forEach(e=>{const d=new Date(e.date+'T00:00:00');const key=`${d.getFullYear()}-${d.getMonth()}`;(byMonth[key]=byMonth[key]||[]).push(e);});
  Object.keys(byMonth).sort().forEach(key=>{
    const[y,m]=key.split('-').map(Number);
    html+=`<div class="list-section"><div class="list-month-title">${MONTHS[m]} ${y}</div>`;
    html+=byMonth[key].map(e=>listRow(e,false)).join('');
    html+='</div>';
  });

  document.getElementById('cal-output').innerHTML=html;
}

function listRow(e,isOver){
  const d=new Date(e.date+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  const dateStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const diffStr=isOver?`${Math.abs(diff)}d over`:diff===0?'Today':diff===1?'Tomorrow':`${diff}d`;
  const dateCls=isOver?'over':diff<=7?'soon':'';
  const dot=e.over?'#E24B4A':EV_DOT[e.type]||'#888';
  const badge=e.job?`<span class="badge ${SC[e.job.status]||''}">${e.job.status}</span>`:'';
  const taskBadge=e.task?`<span class="badge ${TC[e.task.status]||''}">${e.task.status}</span>`:'';
  return`<div class="list-row">
    <div class="list-date ${dateCls}">${dateStr}<br><span style="font-size:11px;color:inherit">${diffStr}</span></div>
    <div class="list-type-dot" style="background:${dot}"></div>
    <div class="list-info">
      <div class="list-label">${e.label}</div>
      <div class="list-sub">${e.typeLabel} · ${e.sub}</div>
    </div>
    ${badge||taskBadge}
  </div>`;
}

// Popover
let allEvents=[];
function showPop(dateStr,evt){
  evt.stopPropagation();
  const events=buildEvents().filter(e=>e.date===dateStr);
  const d=new Date(dateStr+'T00:00:00');
  const title=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('pop-date-title').textContent=title;
  document.getElementById('pop-items').innerHTML=events.length?events.map(e=>`
    <div class="pop-item">
      <div class="pop-dot" style="background:${e.over?'#E24B4A':EV_DOT[e.type]||'#888'}"></div>
      <div class="pop-info">
        <div class="pop-label">${e.label}</div>
        <div class="pop-sub">${e.typeLabel} · ${e.sub}</div>
      </div>
    </div>`).join(''):'<div style="color:#aaa;font-size:13px">No events</div>';
  const pop=document.getElementById('day-pop');
  pop.classList.add('open');
  // position near click
  const vw=window.innerWidth,vh=window.innerHeight;
  let x=evt.clientX+12,y=evt.clientY+12;
  if(x+330>vw)x=evt.clientX-330;
  if(y+250>vh)y=evt.clientY-250;
  pop.style.left=Math.max(8,x)+'px';
  pop.style.top=Math.max(8,y)+'px';
}
function closePop(){document.getElementById('day-pop').classList.remove('open');}
document.addEventListener('click',e=>{const p=document.getElementById('day-pop');if(p.classList.contains('open')&&!p.contains(e.target))closePop();});

['f-drafter','f-type'].forEach(id=>document.getElementById(id).addEventListener('change',renderCal));
loadAll();
setView('month');
</script>
</body>
</html>
