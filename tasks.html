<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var role=localStorage.getItem('jt_role');
    var auth=localStorage.getItem('jobtrack-auth');
    if(!auth||!role||role!=='admin'){
      // Clear stale data and go to login
      localStorage.removeItem('jt_role');
      window.location.replace('login.html');
    }
  }catch(e){window.location.replace('login.html');}
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonus Electric — Tasks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a18;min-height:100vh;font-size:15px}
header{background:#fff;border-bottom:1px solid #e0dfd8;padding:.85rem 1.5rem;display:flex;align-items:center;gap:1.5rem;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{display:flex;align-items:center;margin-right:.5rem}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav-a{padding:6px 14px;border-radius:6px;font-size:14px;text-decoration:none;color:#6b6a65;font-weight:500;white-space:nowrap}
.nav-a:hover{background:#f0efe8;color:#1a1a18}.nav-a.active{background:#F7F0F1;color:#C41230}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#1baf7a;display:inline-block;vertical-align:middle}
.sync-dot.off{background:#e0dfd8}.sync-dot.err{background:#A32D2D}
main{padding:1.25rem 1.5rem;max-width:1400px}
.toolbar{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{font-size:14px;height:36px;padding:0 10px;border:1px solid #c8c7c0;border-radius:6px;background:#fff;color:#1a1a18;outline:none}
.toolbar input{min-width:200px;flex:1}
.toolbar input:focus,.toolbar select:focus{border-color:#C41230;box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.btn{height:36px;padding:0 14px;border-radius:6px;border:1px solid #c8c7c0;background:#fff;color:#1a1a18;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0efe8}.btn.primary{background:#C41230;color:#fff;border-color:#C41230;font-weight:500}.btn.primary:hover{background:#3D0A14}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.b-active{background:#F7F0F1;color:#3D0A14}.b-review{background:#FAEEDA;color:#633806}
.b-complete{background:#EAF3DE;color:#27500A}.b-onhold{background:#F1EFE8;color:#444441}.b-cancelled{background:#FCEBEB;color:#791F1F}
.t-todo{background:#F1EFE8;color:#444441}.t-inprog{background:#F7F0F1;color:#3D0A14}
.t-done{background:#EAF3DE;color:#27500A}.t-blocked{background:#FCEBEB;color:#791F1F}
.settings-bar{background:#fff;border:1px solid #e0dfd8;border-radius:8px;padding:.6rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:#6b6a65}
.settings-bar label{font-weight:500;color:#1a1a18}
.settings-bar input{width:60px;height:28px;padding:0 8px;border:1px solid #c8c7c0;border-radius:5px;font-size:13px;outline:none;text-align:center}
.settings-bar input:focus{border-color:#C41230}
.job-group{background:#fff;border:1px solid #e0dfd8;border-radius:12px;margin-bottom:14px;overflow:hidden}
.job-group-header{display:flex;align-items:center;gap:12px;padding:.9rem 1.1rem;cursor:pointer;user-select:none;border-bottom:1px solid #f0efe8}
.job-group-header:hover{background:#fafaf8}.job-group-header.collapsed{border-bottom:none}
.jg-no{font-weight:700;font-size:15px;white-space:nowrap}.jg-client{font-size:14px;font-weight:500}
.jg-drafter{font-size:13px;color:#6b6a65}.jg-spacer{flex:1}
.jg-counts{font-size:12px;color:#6b6a65;white-space:nowrap}
.jg-chevron{font-size:12px;color:#6b6a65;transition:transform .2s}.jg-chevron.open{transform:rotate(180deg)}
.add-task-row{display:flex;align-items:center;gap:8px;padding:.65rem 1.1rem;border-top:1px solid #f5f5f2;background:#fafaf8}
.add-task-row input{flex:1;font-size:13px;height:30px;padding:0 9px;border:1px solid #c8c7c0;border-radius:6px;outline:none;background:#fff}
.add-task-row input:focus{border-color:#C41230}
.task-row{display:grid;grid-template-columns:20px 1fr auto;gap:0 10px;padding:9px 1.1rem;border-bottom:1px solid #f5f5f2;align-items:start}
.task-row:last-of-type{border-bottom:none}.task-row:hover{background:#fafaf8}
.task-cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #c8c7c0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.task-cb.checked{background:#C41230;border-color:#C41230}.task-cb.checked::after{content:'✓';color:#fff;font-size:10px;font-weight:700}
.task-main{min-width:0}
.task-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.task-nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.task-nm.done-text{text-decoration:line-through;color:#aaa;font-weight:400}
.task-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:#6b6a65}
.task-actions{display:flex;gap:2px;padding-top:1px}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px 5px;border-radius:4px;color:#6b6a65;font-size:14px;line-height:1}
.icon-btn:hover{background:#f0efe8;color:#1a1a18}
.due-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap}
.due-ok{background:#f5f5f2;color:#6b6a65}.due-soon{background:#FAEEDA;color:#633806}.due-over{background:#FCEBEB;color:#A32D2D}
.start-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap}
.start-ok{background:#EAF3DE;color:#27500A}.start-soon{background:#FAEEDA;color:#633806}.start-late{background:#FCEBEB;color:#A32D2D}
.p-high{background:#FAEEDA;color:#633806}.p-urgent{background:#FCEBEB;color:#791F1F}.p-low{background:#F1EFE8;color:#444441}
.priority-chip{font-size:11px;padding:1px 6px;border-radius:3px;font-weight:500}
.start-callout{background:#EAF3DE;border:1px solid #C0DD97;border-radius:8px;padding:.7rem .9rem;font-size:13px;color:#27500A;margin-bottom:14px;display:none}
.start-callout.warn{background:#FAEEDA;border-color:#FAC775;color:#633806}
.start-callout.late{background:#FCEBEB;border-color:#F7C1C1;color:#791F1F}
.empty{text-align:center;padding:2rem;color:#6b6a65;font-size:14px}
.no-tasks{color:#aaa;font-size:13px;padding:.75rem 1.1rem;font-style:italic}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.75rem;width:560px;max-width:100%;border:1px solid #e0dfd8;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.modal-hdr h2{font-size:18px;font-weight:600}
.close-btn{background:none;border:none;cursor:pointer;font-size:20px;color:#6b6a65;padding:2px 6px;border-radius:4px}
.close-btn:hover{background:#f0efe8}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:#6b6a65;margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid #c8c7c0;border-radius:7px;font-size:14px;background:#fff;color:#1a1a18;outline:none;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#C41230;box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.field textarea{height:68px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e0dfd8}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="logo.jpg" alt="Bonus Electric & Technology Solutions" style="height:38px;width:auto;object-fit:contain;display:block"></div>
  <nav>
    <a href="index.html" class="nav-a">Projects</a>
    <a href="tasks.html" class="nav-a active">Tasks</a>
    <a href="calendar.html" class="nav-a">Calendar</a>
    <a href="dashboard.html" class="nav-a">Dashboard</a>
  </nav>
  <span title="Live sync"><span class="sync-dot off" id="sync-dot"></span></span>
</header>
<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search tasks, projects…">
    <select id="f-job"><option value="">All projects</option></select>
    <select id="f-status"><option value="">All statuses</option><option value="To do">To do</option><option value="In progress">In progress</option><option value="Done">Done</option><option value="Blocked">Blocked</option></select>
    <select id="f-drafter"><option value="">All drafters</option></select>
    <button class="btn primary" onclick="openTaskModal()">+ Add task</button>
  </div>
  <div class="settings-bar">
    <label>Drafting hours per workday:</label>
    <input type="number" id="hrs-per-day" min="1" max="24" value="8" oninput="saveHPD();render()">
    <span>Used to calculate "Start by" dates. Weekends are skipped.</span>
  </div>
  <div id="task-list"><div class="empty">Connecting to database…</div></div>
</main>

<!-- Task modal -->
<div class="modal-bg" id="modal-bg" onclick="bgClose(event,'modal-bg')">
  <div class="modal">
    <div class="modal-hdr"><h2 id="modal-title">Add task</h2><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Project *</label><select id="t-jobId"><option value="">Select project…</option></select></div>
    <div class="field"><label>Task name *</label><input id="t-name" placeholder="What needs to be done?"></div>
    <div class="field"><label>Description</label><textarea id="t-desc"></textarea></div>
    <div class="row2">
      <div class="field"><label>Status</label><select id="t-status"><option>To do</option><option>In progress</option><option>Done</option><option>Blocked</option></select></div>
      <div class="field"><label>Priority</label><select id="t-priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Assigned to</label><select id="t-assignee"><option value="">— Unassigned —</option></select></div>
      <div class="field"><label>Due date</label><input type="date" id="t-due" oninput="updateCallout()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Drafting hours needed</label>
        <select id="t-hours" oninput="updateCallout()">
          <option value="">— Not set —</option>
          <option value="1">1 hr</option><option value="2">2 hrs</option><option value="3">3 hrs</option>
          <option value="4">4 hrs</option><option value="6">6 hrs</option><option value="8">8 hrs (1 day)</option>
          <option value="12">12 hrs</option><option value="16">16 hrs (2 days)</option><option value="24">24 hrs (3 days)</option>
          <option value="32">32 hrs (4 days)</option><option value="40">40 hrs (1 wk)</option>
          <option value="60">60 hrs (1.5 wks)</option><option value="80">80 hrs (2 wks)</option>
          <option value="120">120 hrs (3 wks)</option><option value="160">160 hrs (1 mo)</option>
        </select>
      </div>
      <div class="field"><label>Or custom hours</label><input type="number" id="t-hours-custom" min="0.5" step="0.5" placeholder="e.g. 18" oninput="updateCallout()"></div>
    </div>
    <div class="start-callout" id="start-callout"></div>
    <div class="field"><label>Notes</label><textarea id="t-notes"></textarea></div>
    <div class="modal-btns"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask()">Save task</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script>
// ── Add sign-out button ─────────────────────────────────────────────────────
(async function(){
  const hdr = document.querySelector('header');
  if(hdr && !document.getElementById('signout-btn')){
    const sb = document.createElement('button');
    sb.id = 'signout-btn';
    sb.textContent = 'Sign out';
    sb.style.cssText = 'margin-left:auto;height:30px;padding:0 12px;border:1px solid #c8c7c0;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;color:#1a1a18;white-space:nowrap;flex-shrink:0';
    sb.onmouseenter = () => sb.style.background = '#f0efe8';
    sb.onmouseleave = () => sb.style.background = '#fff';
    sb.onclick = async () => {
      localStorage.removeItem('jt_role');
      await db.auth.signOut();
      window.location.replace('login.html');
    };
    hdr.appendChild(sb);
  }
})();

const SC={Active:'b-active','In review':'b-review',Complete:'b-complete','On hold':'b-onhold',Cancelled:'b-cancelled'};
const TC={'To do':'t-todo','In progress':'t-inprog','Done':'t-done','Blocked':'t-blocked'};
const PL={high:'p-high',urgent:'p-urgent',low:'p-low',normal:''};
let jobs=[],drafters=[],tasks=[],hpd=8;
let editTaskId=null,collapsed={};
const dot=document.getElementById('sync-dot');
function setSyncDot(s){dot.className='sync-dot'+(s==='on'?' ':s==='err'?' err':' off');}

async function loadHPD(){
  const {data}=await db.from('jt_settings').select('value').eq('key','hrsPerDay').single();
  if(data){hpd=parseFloat(data.value)||8;document.getElementById('hrs-per-day').value=hpd;}
}
async function saveHPD(){
  hpd=Math.max(1,parseFloat(document.getElementById('hrs-per-day').value)||8);
  await db.from('jt_settings').upsert({key:'hrsPerDay',value:String(hpd)});
}

async function loadAll(){
  try{
    const [j,d,t]=await Promise.all([
      db.from('jt_jobs').select('*').order('job_no'),
      db.from('jt_drafters').select('*').order('name'),
      db.from('jt_tasks').select('*').order('created_at')
    ]);
    if(j.error||d.error||t.error)throw j.error||d.error||t.error;
    jobs=j.data; drafters=d.data.map(r=>r.name); tasks=t.data;
    setSyncDot('on'); populateSelects(); render();
  }catch(e){setSyncDot('err');toast('Database error: '+e.message,'error');}
}

db.channel('tasks-page')
  .on('postgres_changes',{event:'*',schema:'public',table:'jt_tasks'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'jt_jobs'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'jt_drafters'},()=>loadAll())
  .subscribe(s=>setSyncDot(s==='SUBSCRIBED'?'on':'off'));

function populateSelects(){
  const initJob=new URLSearchParams(window.location.search).get('job')||'';
  const fj=document.getElementById('f-job');
  fj.innerHTML='<option value="">All projects</option>'+jobs.map(j=>`<option value="${j.id}">${j.job_no} — ${j.client}</option>`).join('');
  if(initJob)fj.value=initJob;
  document.getElementById('f-drafter').innerHTML='<option value="">All drafters</option>'+drafters.map(d=>`<option>${d}</option>`).join('');
  document.getElementById('t-jobId').innerHTML='<option value="">Select project…</option>'+jobs.map(j=>`<option value="${j.id}">${j.job_no} — ${j.client}</option>`).join('');
  document.getElementById('t-assignee').innerHTML='<option value="">— Unassigned —</option>'+drafters.map(d=>`<option>${d}</option>`).join('');
}

function dueCls(d,s){if(s==='Done')return'due-ok';const n=daysDiff(d);if(n===null)return'due-ok';return n<0?'due-over':n<=7?'due-soon':'due-ok';}
function startChipHtml(t){
  const hrs=getHours(t);if(!t.due||!hrs||t.status==='Done')return'';
  const s=calcStartDate(t.due,hrs,hpd);if(!s)return'';
  const n=daysDiff(s);let cls,str;
  if(n<0){cls='start-late';str=`Start by ${fmtDate(s)} (${Math.abs(n)}d late!)`;}
  else if(n===0){cls='start-soon';str='Start TODAY';}
  else if(n<=3){cls='start-soon';str=`Start by ${fmtDate(s)} (${n}d)`;}
  else{cls='start-ok';str=`Start by ${fmtDate(s)}`;}
  return`<span class="start-chip ${cls}">⏱ ${str}</span>`;
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  const fj=document.getElementById('f-job').value;
  const fs=document.getElementById('f-status').value;
  const fd=document.getElementById('f-drafter').value;
  return tasks.filter(t=>{
    if(fj&&t.job_id!==fj)return false;
    if(fs&&t.status!==fs)return false;
    if(fd&&t.assignee!==fd)return false;
    if(q){const job=jobs.find(j=>j.id===t.job_id)||{};
      if(![t.name,t.description,t.notes,job.job_no,job.client].join(' ').toLowerCase().includes(q))return false;}
    return true;
  });
}

function render(){
  const filtered=getFiltered();
  const fj=document.getElementById('f-job').value;
  const container=document.getElementById('task-list');
  const groupJobs=fj?jobs.filter(j=>j.id===fj):jobs;
  const jobsWithTasks=groupJobs.filter(j=>filtered.some(t=>t.job_id===j.id));
  if(!jobsWithTasks.length){container.innerHTML=`<div class="empty">${tasks.length?'No tasks match filters.':'No tasks yet — add one!'}</div>`;return;}
  container.innerHTML=jobsWithTasks.map(j=>{
    const jt=filtered.filter(t=>t.job_id===j.id);
    const open=jt.filter(t=>t.status!=='Done').length;
    const done=jt.filter(t=>t.status==='Done').length;
    const isColl=!!collapsed[j.id];
    return`<div class="job-group" id="jg-${j.id}">
      <div class="job-group-header${isColl?' collapsed':''}" onclick="toggleGroup('${j.id}')">
        <span class="jg-no">${j.job_no}</span>
        <span class="jg-client">${j.client}</span>
        <span class="badge ${SC[j.status]||''}">${j.status}</span>
        ${j.drafter?j.drafter.split(',').map(s=>`<span class="jg-drafter">${s.trim()}</span>`).join(' '):''}
        <span class="jg-spacer"></span>
        <span class="jg-counts">${open} open · ${done} done</span>
        <span class="jg-chevron ${isColl?'':'open'}">▼</span>
      </div>
      ${isColl?'':renderRows(jt,j)}
    </div>`;
  }).join('');
}

function renderRows(jTasks,j){
  const ord={'Blocked':0,'In progress':1,'To do':2,'Done':3};
  const sorted=jTasks.slice().sort((a,b)=>{
    if(ord[a.status]!==ord[b.status])return ord[a.status]-ord[b.status];
    return(a.due||'z').localeCompare(b.due||'z');
  });
  const rows=sorted.map(t=>{
    const isDone=t.status==='Done';
    const hrs=getHours(t);
    const dc=dueCls(t.due,t.status);
    const n=daysDiff(t.due);
    let dueStr='';
    if(t.due){dueStr=isDone?fmtDate(t.due):n<0?`${fmtDate(t.due)} (${Math.abs(n)}d over)`:n===0?`${fmtDate(t.due)} (today)`:n<=7?`${fmtDate(t.due)} (${n}d)`:fmtDate(t.due);}
    const sc=startChipHtml(t);
    return`<div class="task-row">
      <div class="task-cb ${isDone?'checked':''}" onclick="toggleDone('${t.id}','${t.status}')"></div>
      <div class="task-main">
        <div class="task-top">
          <span class="task-nm ${isDone?'done-text':''}">${t.name}</span>
          <span class="badge ${TC[t.status]||''}">${t.status}</span>
          ${t.priority&&t.priority!=='normal'?`<span class="priority-chip ${PL[t.priority]||''}">${t.priority}</span>`:''}
        </div>
        <div class="task-bottom">
          ${dueStr?`<span class="due-chip ${dc}">📅 Due ${dueStr}</span>`:''}
          ${sc}
          ${hrs>0?`<span style="color:#6b6a65">🕐 ${hrs}h</span>`:''}
          ${t.assignee?`<span>${t.assignee}</span>`:''}
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" onclick="openTaskModal('${t.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteTask('${t.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
  const addRow=`<div class="add-task-row">
    <input id="quick-${j.id}" placeholder="Quick add — press Enter…" onkeydown="if(event.key==='Enter')quickAdd('${j.id}')">
    <button class="btn sm primary" onclick="quickAdd('${j.id}')">Add</button>
    <button class="btn sm" onclick="openTaskModalForJob('${j.id}')">More options</button>
  </div>`;
  return(sorted.length?rows:'<div class="no-tasks">No tasks yet — add one below.</div>')+addRow;
}

function toggleGroup(id){collapsed[id]=!collapsed[id];render();}

async function quickAdd(jobId){
  const el=document.getElementById('quick-'+jobId);
  const name=(el?el.value:'').trim();if(!name)return;
  const {error}=await db.from('jt_tasks').insert({job_id:jobId,name,status:'To do',priority:'normal'});
  if(error)toast('Could not add task: '+error.message,'error');
  else{if(el)el.value='';}
}

async function toggleDone(id,currentStatus){
  const newStatus=currentStatus==='Done'?'To do':'Done';
  const {error}=await db.from('jt_tasks').update({status:newStatus,updated_at:new Date().toISOString()}).eq('id',id);
  if(error)toast('Update failed: '+error.message,'error');
}

async function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  await db.from('jt_tasks').delete().eq('id',id);
}

function updateCallout(){
  const due=document.getElementById('t-due').value;
  const hrs=parseFloat(document.getElementById('t-hours-custom').value)||parseFloat(document.getElementById('t-hours').value)||0;
  const el=document.getElementById('start-callout');
  if(!due||!hrs){el.style.display='none';return;}
  const start=calcStartDate(due,hrs,hpd);if(!start){el.style.display='none';return;}
  const n=daysDiff(start);
  const days=Math.ceil(hrs/hpd);
  let cls='',msg='';
  if(n<0){cls='late';msg=`⚠️ <strong>Should have started ${Math.abs(n)}d ago</strong> — ${hrs}h needed (${days} workday${days!==1?'s':''}).`;}
  else if(n===0){cls='warn';msg=`⏰ <strong>Must start today</strong> — ${hrs}h needed (${days} workday${days!==1?'s':''}).`;}
  else if(n<=3){cls='warn';msg=`📅 <strong>Start by ${fmtDate(start)}</strong> — ${hrs}h (${days} workday${days!==1?'s':''}).`;}
  else{cls='';msg=`✅ <strong>Start by ${fmtDate(start)}</strong> — ${hrs}h (${days} workday${days!==1?'s':''}).`;}
  el.className='start-callout'+(cls?' '+cls:'');el.innerHTML=msg;el.style.display='block';
}

function openTaskModal(id){
  editTaskId=id||null;
  const t=id?(tasks.find(x=>x.id===id)||{}):{};
  document.getElementById('modal-title').textContent=id?'Edit task':'Add task';
  document.getElementById('t-jobId').value=t.job_id||'';
  document.getElementById('t-name').value=t.name||'';
  document.getElementById('t-desc').value=t.description||'';
  document.getElementById('t-status').value=t.status||'To do';
  document.getElementById('t-priority').value=t.priority||'normal';
  document.getElementById('t-assignee').value=t.assignee||'';
  document.getElementById('t-due').value=t.due||'';
  document.getElementById('t-hours').value=t.hours||'';
  document.getElementById('t-hours-custom').value=t.hours_custom||'';
  document.getElementById('t-notes').value=t.notes||'';
  document.getElementById('start-callout').style.display='none';
  updateCallout();
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('t-name').focus(),50);
}
function openTaskModalForJob(jobId){openTaskModal();document.getElementById('t-jobId').value=jobId;}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');editTaskId=null;}

async function saveTask(){
  const job_id=document.getElementById('t-jobId').value;
  const name=document.getElementById('t-name').value.trim();
  if(!job_id||!name){alert('Project and task name are required.');return;}
  const row={job_id,name,
    description:document.getElementById('t-desc').value.trim(),
    status:document.getElementById('t-status').value,
    priority:document.getElementById('t-priority').value,
    assignee:document.getElementById('t-assignee').value||null,
    due:document.getElementById('t-due').value||null,
    hours:parseFloat(document.getElementById('t-hours').value)||null,
    hours_custom:parseFloat(document.getElementById('t-hours-custom').value)||null,
    notes:document.getElementById('t-notes').value.trim(),
    updated_at:new Date().toISOString()
  };
  const {error}=editTaskId?await db.from('jt_tasks').update(row).eq('id',editTaskId):await db.from('jt_tasks').insert(row);
  if(error)toast('Save failed: '+error.message,'error');
  else{toast(editTaskId?'Task updated':'Task added','ok');closeModal();}
}

function bgClose(e,id){if(e.target.id===id)document.getElementById(id).classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
