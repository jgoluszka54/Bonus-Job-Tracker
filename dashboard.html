<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var s=localStorage.getItem('jobtrack-auth');
    var role=localStorage.getItem('jt_role');
    if(!s){window.location.replace('login.html');return;}
    var parsed=JSON.parse(s);
    if(!parsed||!parsed.access_token){window.location.replace('login.html');return;}
    if(role&&role!=='admin'){window.location.replace('my-tasks.html');}
  }catch(e){window.location.replace('login.html');}
})();
</script>
<script>
/* Sync auth guard — runs before page paints */
(function(){
  var role=localStorage.getItem('jt_role');
  var hasSession=false;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('auth-token')!==-1){try{var v=JSON.parse(localStorage.getItem(k));if(v&&v.access_token)hasSession=true;}catch(e){}}}
  if(!hasSession){window.location.replace('login.html');return;}
  if(role&&role!=='admin'){window.location.replace('my-tasks.html');}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTrack — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a18;min-height:100vh;font-size:15px}
header{background:#fff;border-bottom:1px solid #e0dfd8;padding:0.85rem 1.5rem;display:flex;align-items:center;gap:1.5rem;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-size:19px;font-weight:700;letter-spacing:-0.4px;white-space:nowrap;margin-right:0.5rem}
.logo span{color:#185FA5}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav-a{padding:6px 14px;border-radius:6px;font-size:14px;text-decoration:none;color:#6b6a65;font-weight:500;transition:all 0.1s;white-space:nowrap}
.nav-a:hover{background:#f0efe8;color:#1a1a18}
.nav-a.active{background:#E6F1FB;color:#0C447C}
.hdr-right{display:flex;align-items:center;gap:10px}
.upd{font-size:12px;color:#aaa}
.ref-btn{font-size:13px;padding:5px 12px;border:1px solid #c8c7c0;border-radius:6px;background:#fff;cursor:pointer;color:#1a1a18}
.ref-btn:hover{background:#f0efe8}
main{padding:1.25rem 1.5rem;max-width:1400px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.kpi{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:0.85rem 1rem}
.kpi-n{font-size:26px;font-weight:700;line-height:1;margin-bottom:3px}
.kpi-l{font-size:11px;color:#6b6a65;text-transform:uppercase;letter-spacing:0.5px}
.blue{color:#185FA5}.amber{color:#854F0B}.red{color:#A32D2D}.green{color:#27500A}.purple{color:#534AB7}

/* Section */
.sec{font-size:12px;font-weight:600;color:#6b6a65;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.9rem}

/* Filter */
.fbar{display:flex;gap:8px;margin-bottom:1.25rem;align-items:center;flex-wrap:wrap}
.fbar select{font-size:13px;height:32px;padding:0 9px;border:1px solid #c8c7c0;border-radius:6px;background:#fff;color:#1a1a18;outline:none}
.fbar select:focus{border-color:#185FA5}
.fbar label{font-size:13px;color:#6b6a65}

/* Drafter cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:1.75rem}
.dcard{background:#fff;border:1px solid #e0dfd8;border-radius:12px;overflow:hidden;transition:border-color 0.15s}
.dcard:hover{border-color:#c0bfb8}
.dcard-head{display:flex;align-items:center;gap:11px;padding:1rem 1.1rem 0.9rem;border-bottom:1px solid #f0efe8}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.dcard-name{font-size:15px;font-weight:600;line-height:1.2}
.dcard-sub{font-size:12px;color:#6b6a65;margin-top:2px}
.dcard-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}

/* Tabs inside card */
.card-tabs{display:flex;border-bottom:1px solid #f0efe8;background:#fafaf8}
.card-tab{flex:1;text-align:center;padding:6px 4px;font-size:12px;font-weight:500;color:#6b6a65;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;user-select:none}
.card-tab:hover{color:#1a1a18}
.card-tab.active{color:#185FA5;border-bottom-color:#185FA5;background:#fff}

/* Tasks inside card */
.task-list-inner{padding:0;max-height:260px;overflow-y:auto}
.task-item{display:flex;align-items:flex-start;gap:9px;padding:8px 1.1rem;border-bottom:1px solid #f5f5f2;font-size:13px}
.task-item:last-child{border-bottom:none}
.task-cb{width:15px;height:15px;border-radius:3px;border:1.5px solid #c8c7c0;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.task-cb.done{background:#185FA5;border-color:#185FA5;color:#fff;font-size:9px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.task-nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.task-nm.done-txt{text-decoration:line-through;color:#aaa;font-weight:400}
.task-meta{font-size:11px;color:#6b6a65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-due-s{font-size:11px;font-weight:500;white-space:nowrap}
.task-due-s.over{color:#A32D2D}
.task-due-s.soon{color:#854F0B}
.task-due-s.ok{color:#6b6a65}
.ds-chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 6px;border-radius:3px;white-space:nowrap;margin-right:4px}
.start-ok{background:#EAF3DE;color:#27500A}
.start-soon{background:#FAEEDA;color:#633806}
.start-late{background:#FCEBEB;color:#A32D2D}

/* Jobs inside card */
.job-item{display:flex;align-items:center;gap:8px;padding:7px 1.1rem;border-bottom:1px solid #f5f5f2;font-size:13px}
.job-item:last-child{border-bottom:none}
.job-left{flex:1;min-width:0}
.job-no{font-size:11px;color:#6b6a65;margin-bottom:1px}

.job-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.jdue{font-size:11px;white-space:nowrap}

.jdue.soon{color:#854F0B;font-weight:500}

/* Load bar */
.lbar-wrap{padding:0.65rem 1.1rem;border-bottom:1px solid #f0efe8;background:#fafaf8}
.lbar-labels{display:flex;justify-content:space-between;font-size:11px;color:#6b6a65;margin-bottom:4px}
.lbar{height:6px;background:#e0dfd8;border-radius:3px;overflow:hidden}
.lbar-f{height:100%;border-radius:3px;transition:width 0.4s}

.more-row{font-size:12px;color:#6b6a65;text-align:center;padding:6px;background:#fafaf8;border-top:1px solid #f0efe8;cursor:pointer}
.more-row a{color:#185FA5;text-decoration:none}
.no-items{font-size:13px;color:#aaa;text-align:center;padding:1rem}

/* Badges */
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;font-weight:500;white-space:nowrap}
.b-active{background:#E6F1FB;color:#0C447C}
.b-review{background:#FAEEDA;color:#633806}
.b-complete{background:#EAF3DE;color:#27500A}
.b-onhold{background:#F1EFE8;color:#444441}
.b-cancelled{background:#FCEBEB;color:#791F1F}
.t-todo{background:#F1EFE8;color:#444441}
.t-prog{background:#E6F1FB;color:#0C447C}
.t-done{background:#EAF3DE;color:#27500A}
.t-block{background:#FCEBEB;color:#791F1F}
.p-urgent{background:#FCEBEB;color:#791F1F}
.p-high{background:#FAEEDA;color:#633806}
.p-low{background:#F1EFE8;color:#444441}

/* Charts */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.75rem}
.chart-card{background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:1.1rem 1.2rem}
.chart-card .sec{margin-bottom:0.75rem}

/* Timeline */
.tl-card{background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1.75rem}
.tl-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f5f5f2;font-size:13px}
.tl-row:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-info{flex:1;min-width:0}
.tl-main{display:flex;align-items:center;gap:7px;margin-bottom:2px;flex-wrap:wrap}
.tl-nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tl-who{font-size:12px;color:#6b6a65}
.tl-lbl{font-size:11px;color:#6b6a65;background:#f5f5f2;padding:1px 6px;border-radius:3px}
.tl-date{font-size:12px;font-weight:500;text-align:right;white-space:nowrap;flex-shrink:0}
.tl-date.over{color:#A32D2D}

.empty{text-align:center;padding:2.5rem;color:#6b6a65}

@media(max-width:800px){.charts-row{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const SC={Active:'b-active','In review':'b-review',Complete:'b-complete','On hold':'b-onhold',Cancelled:'b-cancelled'};
const TC={'To do':'t-todo','In progress':'t-prog',Done:'t-done',Blocked:'t-block'};
const PC={urgent:'p-urgent',high:'p-high',low:'p-low',normal:''};
const COLORS=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#4a3aa7','#e34948'];
const AVCOLORS=[{bg:'#E6F1FB',fg:'#0C447C'},{bg:'#EAF3DE',fg:'#27500A'},{bg:'#FAEEDA',fg:'#633806'},{bg:'#EEEDFE',fg:'#3C3489'},{bg:'#FAECE7',fg:'#712B13'},{bg:'#F1EFE8',fg:'#444441'},{bg:'#FBEAF0',fg:'#72243E'}];
const TASK_COLORS={'To do':'#888780','In progress':'#2a78d6',Done:'#1baf7a',Blocked:'#e34948'};


// ── Async auth verification (after page shown) ────────────────────────────
(async function(){
  const {data:{session}} = await db.auth.getSession();
  if(!session){
    localStorage.removeItem('jt_role');
    window.location.replace('login.html');
    return;
  }
  const {data:profile} = await db.from('jt_user_profiles').select('role').eq('id',session.user.id).single();
  if(!profile||profile.role!=='admin'){
    localStorage.removeItem('jt_role');
    window.location.replace('my-tasks.html');
    return;
  }
  localStorage.setItem('jt_role','admin');
  // Add sign-out button
  const hdr=document.querySelector('header');
  if(hdr&&!document.getElementById('signout-btn')){
    const sb=document.createElement('button');
    sb.id='signout-btn';
    sb.textContent='Sign out';
    sb.style.cssText='margin-left:auto;height:30px;padding:0 12px;border:1px solid #c8c7c0;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;color:#1a1a18;white-space:nowrap;flex-shrink:0';
    sb.onmouseenter=()=>sb.style.background='#f0efe8';
    sb.onmouseleave=()=>sb.style.background='#fff';
    sb.onclick=async()=>{localStorage.removeItem('jt_role');await db.auth.signOut();window.location.replace('login.html');};
    hdr.appendChild(sb);
  }
})();
let jobs=[],drafters=[],tasks=[];
let barChart=null,pieChart=null;
function setSyncDot(s){const d=document.getElementById('sync-dot');if(d)d.style.background=s==='on'?'#1baf7a':s==='err'?'#A32D2D':'#e0dfd8';}

async function loadAll(){
  try{
    const [j,d,t]=await Promise.all([
      db.from('jt_jobs').select('*').order('job_no'),
      db.from('jt_drafters').select('*').order('name'),
      db.from('jt_tasks').select('*')
    ]);
    if(j.error||d.error||t.error)throw j.error||d.error||t.error;
    jobs=j.data; drafters=d.data.map(r=>r.name); tasks=t.data;
    setSyncDot('on'); populateFilters(); renderAll();
  }catch(e){setSyncDot('err');toast('Database error: '+e.message,'error');}
}
db.channel('dash-page')
  .on('postgres_changes',{event:'*',schema:'public',table:'jt_jobs'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'jt_tasks'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'jt_drafters'},()=>loadAll())
  .subscribe(s=>setSyncDot(s==='SUBSCRIBED'?'on':'off'));
// track which tab each drafter card is on: 'tasks' or 'jobs'
let cardTab={};

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function daysDiff(d){if(!d)return null;const t=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000);}
function fmtDate(d){if(!d)return'—';const[y,m,day]=d.split('-');return`${m}/${day}/${y}`;}
function dueDayStr(d,done){
  if(!d)return{str:'',cls:''};
  const n=daysDiff(d);
  if(done)return{str:fmtDate(d),cls:'ok'};
  if(n<0)return{str:`${fmtDate(d)} (${Math.abs(n)}d over)`,cls:'over'};
  if(n===0)return{str:`${fmtDate(d)} (today)`,cls:'soon'};
  if(n<=7)return{str:`${fmtDate(d)} (${n}d)`,cls:'soon'};
  return{str:fmtDate(d),cls:'ok'};
}

function calcStartDate(dueDateStr,hoursNeeded,hrsPerDay){
  if(!dueDateStr||!hoursNeeded||hoursNeeded<=0)return null;
  hrsPerDay=hrsPerDay||8;
  let hoursLeft=hoursNeeded;
  let d=new Date(dueDateStr+'T00:00:00');
  while(hoursLeft>0){
    const dow=d.getDay();
    if(dow!==0&&dow!==6)hoursLeft-=hrsPerDay;
    if(hoursLeft>0)d.setDate(d.getDate()-1);
  }
  while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function getHours(t){return parseFloat(t.hours_custom)||parseFloat(t.hours)||0;}
function startChip(t,hpd){
  const hrs=getHours(t);
  if(!t.due||!hrs||t.status==='Done')return'';
  const s=calcStartDate(t.due,hrs,hpd);if(!s)return'';
  const n=daysDiff(s);
  const label='Start by '+fmtDate(s);
  let cls,str;
  if(n<0){cls='start-late';str=label+` (${Math.abs(n)}d late!)`;}
  else if(n===0){cls='start-soon';str='Start TODAY';}
  else if(n<=3){cls='start-soon';str=label+` (${n}d)`;}
  else{cls='start-ok';str=label;}
  return`<span class="ds-chip ${cls}">⏱ ${str}</span>`;
}

function populateFilters(){
  const fd=document.getElementById('f-drafter');
  fd.innerHTML='<option value="">All drafters</option>'+drafters.sort().map(d=>`<option>${d}</option>`).join('');
}

function renderAll(){
  const fd=document.getElementById('f-drafter').value;
  const fs=document.getElementById('f-status').value;
  const filteredJobs=jobs.filter(j=>(fd?j.drafter===fd:true)&&(fs?j.status===fs:true));
  const allDrafters=fd?[fd]:drafters.slice().sort();

  renderKPI(filteredJobs,allDrafters);
  renderCards(allDrafters,filteredJobs);
  renderBarChart(allDrafters);
  renderPieChart();
  renderTimeline(filteredJobs);
  document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// ── KPI ───────────────────────────────────────────────────────────────────
function renderKPI(filteredJobs,allDrafters){
  const allTasks=tasks.filter(t=>{const j=jobs.find(x=>x.id===t.job_id);return j&&(document.getElementById('f-drafter').value?j.drafter===document.getElementById('f-drafter').value:true);});
  const openTasks=allTasks.filter(t=>t.status!=='Done').length;
  const blockedTasks=allTasks.filter(t=>t.status==='Blocked').length;
  const overdueTasks=allTasks.filter(t=>t.status!=='Done'&&t.due&&daysDiff(t.due)<0).length;
  const activeJobs=filteredJobs.filter(j=>j.status==='Active'||j.status==='In review').length;
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi"><div class="kpi-n">${filteredJobs.length}</div><div class="kpi-l">Projects</div></div>
    <div class="kpi"><div class="kpi-n blue">${activeJobs}</div><div class="kpi-l">Active projects</div></div>
    <div class="kpi"><div class="kpi-n purple">${allTasks.length}</div><div class="kpi-l">Total tasks</div></div>
    <div class="kpi"><div class="kpi-n blue">${openTasks}</div><div class="kpi-l">Open tasks</div></div>
    <div class="kpi"><div class="kpi-n red">${blockedTasks}</div><div class="kpi-l">Blocked</div></div>
    <div class="kpi"><div class="kpi-n amber">${overdueTasks}</div><div class="kpi-l">Overdue tasks</div></div>
    <div class="kpi"><div class="kpi-n">${allDrafters.length}</div><div class="kpi-l">Drafters</div></div>
  `;
}

// ── Drafter cards ─────────────────────────────────────────────────────────
function renderCards(allDrafters,filteredJobs){
  const grid=document.getElementById('dgrid');
  if(!allDrafters.length){grid.innerHTML='<div class="empty"><strong>No drafters found</strong>Add projects with assigned drafters to see workload cards.</div>';return;}
  grid.innerHTML='';
  allDrafters.forEach((d,i)=>{
    const ac=AVCOLORS[i%AVCOLORS.length];
    const myJobs=filteredJobs.filter(j=>j.drafter===d&&j.status!=='Cancelled');
    const activeJobs=myJobs.filter(j=>j.status==='Active'||j.status==='In review');
    // Tasks assigned directly to this drafter, or on jobs assigned to them
    const myTasks=tasks.filter(t=>{
      if(t.assignee===d)return true; // directly assigned
      const j=jobs.find(x=>x.id===t.job_id);
      return j&&j.drafter===d&&!t.assignee; // job is theirs and no specific assignee
    });
    const openTasks=myTasks.filter(t=>t.status!=='Done');
    const blockedTasks=myTasks.filter(t=>t.status==='Blocked').length;
    const overdueTasks=openTasks.filter(t=>t.due&&daysDiff(t.due)<0).length;
    const doneTasks=myTasks.filter(t=>t.status==='Done').length;

    // Load bar based on open tasks (max 10 = full)
    const MAX=10;
    const loadPct=Math.min(100,Math.round((openTasks.length/MAX)*100));
    const barColor=loadPct>=90?'#A32D2D':loadPct>=70?'#854F0B':'#185FA5';
    const loadLabel=loadPct>=90?'At capacity':loadPct>=70?'Heavy':'Normal';

    const tags=[];
    if(overdueTasks>0)tags.push(`<span class="badge b-cancelled">${overdueTasks} overdue task${overdueTasks>1?'s':''}</span>`);
    if(blockedTasks>0)tags.push(`<span class="badge t-block">${blockedTasks} blocked</span>`);

    const curTab=cardTab[d]||'tasks';
    const div=document.createElement('div');
    div.className='dcard';
    div.id='card-'+d.replace(/\s/g,'-');
    div.innerHTML=`
      <div class="dcard-head">
        <div class="avatar" style="background:${ac.bg};color:${ac.fg}">${initials(d)}</div>
        <div style="flex:1;min-width:0">
          <div class="dcard-name">${d}</div>
          <div class="dcard-sub">${openTasks.length} open task${openTasks.length!==1?'s':''} · ${activeJobs.length} active project${activeJobs.length!==1?'s':''} · ${loadLabel}</div>
          ${tags.length?`<div class="dcard-tags">${tags.join('')}</div>`:''}
        </div>
      </div>
      <div class="lbar-wrap">
        <div class="lbar-labels"><span>Task load</span><span>${openTasks.length} / ${MAX}</span></div>
        <div class="lbar"><div class="lbar-f" style="width:${loadPct}%;background:${barColor}"></div></div>
      </div>
      <div class="card-tabs">
        <div class="card-tab ${curTab==='tasks'?'active':''}" onclick="switchTab('${d}','tasks')">Tasks (${openTasks.length})</div>
        <div class="card-tab ${curTab==='jobs'?'active':''}" onclick="switchTab('${d}','jobs')">Projects (${activeJobs.length})</div>
      </div>
      <div class="task-list-inner" id="inner-${d.replace(/\s/g,'-')}">
        ${curTab==='tasks'?renderTasksInner(openTasks,myTasks):renderJobsInner(myJobs)}
      </div>
    `;
    grid.appendChild(div);
  });
}

function switchTab(drafter,tab){
  cardTab[drafter]=tab;
  // re-render just this card's inner content + tabs
  const key=drafter.replace(/\s/g,'-');
  const card=document.getElementById('card-'+key);
  if(!card)return;
  // update tab classes
  card.querySelectorAll('.card-tab').forEach((el,i)=>{el.className='card-tab'+(((i===0&&tab==='tasks')||(i===1&&tab==='jobs'))?' active':'');});
  const inner=document.getElementById('inner-'+key);
  const myTasks=tasks.filter(t=>{
    if(t.assignee===drafter)return true;
    const j=jobs.find(x=>x.id===t.job_id);
    return j&&j.drafter===drafter&&!t.assignee;
  });
  const openTasks=myTasks.filter(t=>t.status!=='Done');
  const fs=document.getElementById('f-status').value;
  const myJobs=jobs.filter(j=>j.drafter===drafter&&j.status!=='Cancelled'&&(fs?j.status===fs:true));
  inner.innerHTML=tab==='tasks'?renderTasksInner(openTasks,myTasks):renderJobsInner(myJobs);
}

async function renderTasksInner(openTasks,allMyTasks){
  if(!allMyTasks.length)return'<div class="no-items">No tasks yet</div>';
  const settRow=await db.from('jt_settings').select('value').eq('key','hrsPerDay').single();
  const hpd=Math.max(1,parseFloat(settRow.data?.value)||8);
  const order={Blocked:0,'In progress':1,'To do':2,Done:3};
  const sorted=openTasks.slice().sort((a,b)=>{
    if(order[a.status]!==order[b.status])return order[a.status]-order[b.status];
    if(a.due&&b.due)return a.due.localeCompare(b.due);
    return a.due?-1:b.due?1:0;
  });
  const SHOW=6;
  const shown=sorted.slice(0,SHOW);
  const extra=sorted.length-SHOW;
  const doneCnt=allMyTasks.filter(t=>t.status==='Done').length;

  let html=shown.map(t=>{
    const j=jobs.find(x=>x.id===t.job_id)||{};
    const isDone=t.status==='Done';
    const {str:dueStr,cls:dueCls}=dueDayStr(t.due,isDone);
    const hrs=getHours(t);
    const sc=startChip(t,hpd);
    return`<div class="task-item">
      <div class="task-cb ${isDone?'done':''}'">${isDone?'✓':''}</div>
      <div class="task-body">
        <div class="task-name-row">
          <span class="task-nm ${isDone?'done-txt':''}">${t.name}</span>
          <span class="badge ${TC[t.status]||''}">${t.status}</span>
          ${t.priority&&t.priority!=='normal'?`<span class="badge ${PC[t.priority]||''}">${t.priority}</span>`:''}
        </div>
        <div class="task-meta">
          ${j.job_no?`<strong>${j.job_no}</strong> — `:''}${j.client||''}
          ${dueStr?` · <span class="task-due-s ${dueCls}">${dueStr}</span>`:''}
        </div>
        ${sc||hrs>0?`<div class="task-meta" style="margin-top:2px">${sc}${hrs>0?`<span style="font-size:11px;color:#6b6a65;margin-left:4px">🕐 ${hrs}h</span>`:''}</div>`:''}
      </div>
    </div>`;
  }).join('');

  if(extra>0)html+=`<div class="more-row">+${extra} more open task${extra!==1?'s':''} · <a href="tasks.html">View all</a></div>`;
  if(doneCnt>0)html+=`<div class="more-row" style="color:#6b6a65">${doneCnt} completed task${doneCnt!==1?'s':''} hidden · <a href="tasks.html">View all</a></div>`;
  return html;
}

function renderJobsInner(myJobs){
  if(!myJobs.length)return'<div class="no-items">No projects assigned</div>';
  const sorted=myJobs.slice().sort((a,b)=>{
    const order={'In review':0,Active:1,'On hold':2,Complete:3};
    return (order[a.status]??9)-(order[b.status]??9);
  });
  const SHOW=6;
  const shown=sorted.slice(0,SHOW);
  const extra=sorted.length-SHOW;
  let html=shown.map(j=>{
    const nd=[j.due_design,j.due_draft,j.due_issue].filter(Boolean).sort()[0]||null;
    const {str:dueStr,cls:dueCls}=dueDayStr(nd,j.status==='Complete');
    const openT=tasks.filter(t=>t.job_id===j.id&&t.status!=='Done').length;
    return`<div class="job-item">
      <div class="job-left">
        <div class="job-no">${j.job_no}</div>
        <div class="job-cl">${j.client}</div>
        ${openT>0?`<div style="font-size:11px;color:#6b6a65;margin-top:1px">${openT} open task${openT>1?'s':''}</div>`:''}
      </div>
      <div class="job-right">
        <span class="badge ${SC[j.status]||''}">${j.status}</span>
        ${dueStr?`<span class="jdue ${dueCls}">${dueStr}</span>`:''}
      </div>
    </div>`;
  }).join('');
  if(extra>0)html+=`<div class="more-row">+${extra} more · <a href="index.html">View all</a></div>`;
  return html;
}

// ── Pie chart — task status breakdown ────────────────────────────────────
function renderPieChart(){
  const counts={};
  const fd=document.getElementById('f-drafter').value;
  const relevantTasks=tasks.filter(t=>{
    if(!fd)return true;
    if(t.assignee===fd)return true;
    const j=jobs.find(x=>x.id===t.job_id);
    return j&&j.drafter===fd&&!t.assignee;
  });
  relevantTasks.forEach(t=>{counts[t.status]=(counts[t.status]||0)+1;});
  const statuses=Object.keys(counts);
  const ctx=document.getElementById('pie-chart');
  if(pieChart)pieChart.destroy();
  if(!statuses.length){document.getElementById('pie-legend').innerHTML='<div style="color:#aaa;font-size:13px;text-align:center">No tasks yet</div>';return;}
  pieChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels:statuses,datasets:[{data:statuses.map(s=>counts[s]),backgroundColor:statuses.map(s=>TASK_COLORS[s]||'#ccc'),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.parsed}`}}}}
  });
  document.getElementById('pie-legend').innerHTML=statuses.map(s=>`
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:10px;height:10px;border-radius:2px;background:${TASK_COLORS[s]||'#ccc'};flex-shrink:0"></span>
      <span style="flex:1;font-size:13px;color:#1a1a18">${s}</span>
      <span style="font-size:13px;font-weight:500;color:#6b6a65">${counts[s]}</span>
    </div>`).join('');
}

// ── Timeline — project milestones + task due dates ────────────────────────
function renderTimeline(filteredJobs){
  const fd=document.getElementById('f-drafter').value;
  const entries=[];
  const today=new Date();today.setHours(0,0,0,0);
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()+30);

  // Project milestones
  filteredJobs.filter(j=>j.status!=='Complete'&&j.status!=='Cancelled').forEach(j=>{
    [{key:'due_design',label:'Design due'},{key:'due_draft',label:'Draft due'},{key:'due_issue',label:'Issue date'}].forEach(dt=>{
      if(!j[dt.key])return;
      const d=new Date(j[dt.key]+'T00:00:00');
      if(d>cutoff)return;
      entries.push({date:j[dt.key],label:`${j.job_no} — ${j.client}`,type:dt.label,who:j.drafter||'Unassigned',badge:`<span class="badge ${SC[j.status]||''}">${j.status}</span>`,days:daysDiff(j[dt.key]),dot:'#185FA5'});
    });
  });

  // Tasks with due dates
  tasks.filter(t=>{
    if(t.status==='Done'||!t.due)return false;
    const d=new Date(t.due+'T00:00:00');
    if(d>cutoff)return false;
    const j=jobs.find(x=>x.id===t.job_id);
    if(!j)return false;
    if(fd&&j.drafter!==fd&&t.assignee!==fd)return false;
    return true;
  }).forEach(t=>{
    const j=jobs.find(x=>x.id===t.job_id)||{};
    const assignee=t.assignee||(j.drafter||'Unassigned');
    entries.push({date:t.due,label:t.name,type:'Task',who:assignee,badge:`<span class="badge ${TC[t.status]||''}">${t.status}</span>`,days:daysDiff(t.due),dot:'#eda100'});
  });

  entries.sort((a,b)=>a.date.localeCompare(b.date));
  const tl=document.getElementById('timeline');
  if(!entries.length){tl.innerHTML='<div class="empty"><strong>No upcoming dates</strong>No project milestones or task due dates in the next 30 days.</div>';return;}

  tl.innerHTML=entries.map(e=>{
    const over=e.days<0,soon=e.days>=0&&e.days<=7;
    const dot=over?'#A32D2D':soon?'#854F0B':e.dot;
    const cls=over?'over':soon?'soon':'';
    const dStr=over?`${fmtDate(e.date)} — ${Math.abs(e.days)}d overdue`:e.days===0?`${fmtDate(e.date)} — today`:`${fmtDate(e.date)} — ${e.days}d`;
    return`<div class="tl-row">
      <div class="tl-dot" style="background:${dot}"></div>
      <div class="tl-info">
        <div class="tl-main">
          <span class="tl-nm">${e.label}</span>
          <span class="tl-lbl">${e.type}</span>
          ${e.badge}
        </div>
        <div class="tl-who">${e.who}</div>
      </div>
      <div class="tl-date ${cls}">${dStr}</div>
    </div>`;
  }).join('');
}

// ── PDF Export ────────────────────────────────────────────────────────────
function exportPDF(){
  const btn=document.getElementById('pdf-btn');
  btn.textContent='Generating…';btn.disabled=true;
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
    const pw=doc.internal.pageSize.getWidth();
    const ph=doc.internal.pageSize.getHeight();
    const margin=14;
    const col1=margin;
    let y=margin;
    const settRow2=await db.from('jt_settings').select('value').eq('key','hrsPerDay').single();
    const hpd=Math.max(1,parseFloat(settRow2.data?.value)||8);
    const now=new Date();
    const dateStr=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    const timeStr=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

    // ── helpers ──
    function addPage(){doc.addPage();y=margin;}
    function checkY(need){if(y+need>ph-margin)addPage();}
    function hline(yy,r,g,b){doc.setDrawColor(r||224,g||223,b||216);doc.setLineWidth(0.2);doc.line(margin,yy,pw-margin,yy);}
    function sectionTitle(txt){
      checkY(12);
      doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.setTextColor(107,106,101);
      doc.text(txt.toUpperCase(),col1,y);
      y+=1; hline(y); y+=4;
      doc.setTextColor(26,26,24);
    }
    function cell(txt,x,yy,w,opts){
      opts=opts||{};
      doc.setFont('helvetica',opts.bold?'bold':'normal');
      doc.setFontSize(opts.size||9);
      doc.setTextColor(...(opts.color||[26,26,24]));
      const lines=doc.splitTextToSize(String(txt||''),w);
      doc.text(lines,x,yy,{align:opts.align||'left'});
      return lines.length*(opts.size||9)*0.4;
    }

    // ── Cover header ──
    doc.setFillColor(24,95,165);doc.rect(0,0,pw,18,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(255,255,255);
    doc.text('JobTrack — Workload Dashboard',margin,12);
    doc.setFont('helvetica','normal');doc.setFontSize(9);
    doc.text(`Generated ${dateStr} at ${timeStr}`,pw-margin,12,{align:'right'});
    y=26;

    // ── KPI summary ──
    const fd=document.getElementById('f-drafter').value;
    const fs=document.getElementById('f-status').value;
    const filteredJobs=jobs.filter(j=>(fd?j.drafter===fd:true)&&(fs?j.status===fs:true));
    const allDrafters=fd?[fd]:drafters.slice().sort();
    const relevantTasks=tasks.filter(t=>{
      const j=jobs.find(x=>x.id===t.job_id);
      if(!j)return false;
      if(fd&&j.drafter!==fd&&t.assignee!==fd)return false;
      return true;
    });
    const openT=relevantTasks.filter(t=>t.status!=='Done').length;
    const blockedT=relevantTasks.filter(t=>t.status==='Blocked').length;
    const overdueT=relevantTasks.filter(t=>t.status!=='Done'&&t.due&&daysDiff(t.due)<0).length;
    const activeJ=filteredJobs.filter(j=>j.status==='Active'||j.status==='In review').length;

    sectionTitle('Summary');
    const kpis=[
      ['Total Projects',filteredJobs.length],['Active Projects',activeJ],
      ['Total Tasks',relevantTasks.length],['Open Tasks',openT],
      ['Blocked Tasks',blockedT],['Overdue Tasks',overdueT],
      ['Drafters',allDrafters.length]
    ];
    const kw=(pw-margin*2)/kpis.length;
    kpis.forEach((k,i)=>{
      const x=margin+i*kw;
      doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(24,95,165);
      doc.text(String(k[1]),x+kw/2,y+7,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(107,106,101);
      doc.text(k[0],x+kw/2,y+12,{align:'center'});
    });
    y+=20; hline(y); y+=6;

    // ── Workload per drafter ──
    sectionTitle('Workload per drafter');
    allDrafters.forEach(d=>{
      const myJobs=filteredJobs.filter(j=>j.drafter===d&&j.status!=='Cancelled');
      const myTasks=tasks.filter(t=>(t.assignee===d)||(()=>{const j=jobs.find(x=>x.id===t.job_id);return j&&j.drafter===d&&!t.assignee;})());
      const openTasks=myTasks.filter(t=>t.status!=='Done');
      const done=myTasks.filter(t=>t.status==='Done').length;
      const blocked=myTasks.filter(t=>t.status==='Blocked').length;
      const overdue=openTasks.filter(t=>t.due&&daysDiff(t.due)<0).length;
      const MAX=10;
      const loadPct=Math.min(100,Math.round((openTasks.length/MAX)*100));

      checkY(30+openTasks.slice(0,6).length*7);

      // Drafter name bar
      doc.setFillColor(245,245,242);doc.roundedRect(margin,y,pw-margin*2,8,1,1,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(26,26,24);
      doc.text(d,margin+3,y+5.5);
      // Stats right side
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(107,106,101);
      doc.text(`${openTasks.length} open · ${done} done · ${blocked} blocked · ${overdue} overdue`,pw-margin-3,y+5.5,{align:'right'});
      y+=10;

      // Load bar
      const barW=pw-margin*2;
      doc.setFillColor(224,223,216);doc.roundedRect(margin,y,barW,3,1,1,'F');
      const fillColor=loadPct>=90?[163,45,45]:loadPct>=70?[133,79,11]:[24,95,165];
      doc.setFillColor(...fillColor);doc.roundedRect(margin,y,barW*(loadPct/100),3,1,1,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(107,106,101);
      doc.text(`Task load: ${openTasks.length}/${MAX}`,pw-margin,y+6,{align:'right'});
      y+=9;

      // Task table for this drafter
      if(openTasks.length){
        const sorted=openTasks.slice().sort((a,b)=>{
          const ord={Blocked:0,'In progress':1,'To do':2};
          if((ord[a.status]??9)!==(ord[b.status]??9))return(ord[a.status]??9)-(ord[b.status]??9);
          return(a.due||'z').localeCompare(b.due||'z');
        });
        const rows=sorted.slice(0,8).map(t=>{
          const j=jobs.find(x=>x.id===t.job_id)||{};

          let startStr='—';
          if(t.due&&hrs>0){const s=calcStartDate(t.due,hrs,hpd);if(s)startStr=fmtDate(s);}
          const n=daysDiff(t.due);
          let dueLabel=t.due?fmtDate(t.due):'—';

        });
        doc.autoTable({
          startY:y,
          head:[['Task','Job #','Status','Priority','Due Date','Hours','Start By']],
          body:rows,
          margin:{left:margin,right:margin},
          styles:{fontSize:7.5,cellPadding:2,textColor:[26,26,24],lineColor:[240,239,232],lineWidth:0.2},
          headStyles:{fillColor:[245,245,242],textColor:[107,106,101],fontStyle:'bold',fontSize:7},
          columnStyles:{
            0:{cellWidth:50},1:{cellWidth:18},2:{cellWidth:22},
            3:{cellWidth:18},4:{cellWidth:28},5:{cellWidth:14},6:{cellWidth:24}
          },
          didParseCell:(data)=>{
            if(data.section==='body'){
              const row=rows[data.row.index];
              if(row&&data.column.index===2){
                if(row[2]==='Blocked')data.cell.styles.textColor=[163,45,45];
                else if(row[2]==='In progress')data.cell.styles.textColor=[12,68,124];
              }
              if(row&&data.column.index===4&&row[4].includes('over'))data.cell.styles.textColor=[163,45,45];
              if(row&&data.column.index===6&&row[6]!=='—'){
                const s=calcStartDate(t&&t.due,'',hpd);
              }
            }
          },
          theme:'grid'
        });
        y=doc.lastAutoTable.finalY+6;
      } else {
        doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(170,170,170);
        doc.text('No open tasks',margin+4,y+4);
        y+=8;
      }
      y+=2;
    });

    // ── Upcoming due dates ──
    checkY(20);
    sectionTitle('Upcoming due dates — next 30 days');
    const entries=[];
    const today=new Date();today.setHours(0,0,0,0);
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()+30);
    filteredJobs.filter(j=>j.status!=='Complete'&&j.status!=='Cancelled').forEach(j=>{
      [{key:'due_design',label:'Design due'},{key:'due_draft',label:'Draft due'},{key:'due_issue',label:'Issue date'}].forEach(dt=>{
        if(!j[dt.key])return;
        const d=new Date(j[dt.key]+'T00:00:00');
        if(d>cutoff)return;
        entries.push([fmtDate(j[dt.key]),j.job_no,j.client,dt.label,j.drafter||'—',j.status,String(daysDiff(j[dt.key]))]);
      });
    });
    tasks.filter(t=>{
      if(t.status==='Done'||!t.due)return false;
      const d=new Date(t.due+'T00:00:00');if(d>cutoff)return false;
      const j=jobs.find(x=>x.id===t.job_id);if(!j)return false;
      if(fd&&j.drafter!==fd&&t.assignee!==fd)return false;
      return true;
    }).forEach(t=>{
      const j=jobs.find(x=>x.id===t.job_id)||{};
      entries.push([fmtDate(t.due),j.job_no||'',t.name,'Task',t.assignee||j.drafter||'—',t.status,String(daysDiff(t.due))]);

    entries.sort((a,b)=>a[0].localeCompare(b[0]));

    if(entries.length){

        margin:{left:margin,right:margin},
        styles:{fontSize:7.5,cellPadding:2,textColor:[26,26,24],lineColor:[240,239,232],lineWidth:0.2},
        headStyles:{fillColor:[245,245,242],textColor:[107,106,101],fontStyle:'bold',fontSize:7},
        columnStyles:{0:{cellWidth:22},1:{cellWidth:16},2:{cellWidth:55},3:{cellWidth:20},4:{cellWidth:32},5:{cellWidth:20},6:{cellWidth:12}},
        didParseCell:(data)=>{
          if(data.section==='body'&&data.column.index===6){
            const v=parseInt(data.cell.raw);
            if(v<0)data.cell.styles.textColor=[163,45,45];
            else if(v<=7)data.cell.styles.textColor=[133,79,11];
          }
        },
        theme:'grid'
      });
      y=doc.lastAutoTable.finalY+6;
    } else {
      doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(170,170,170);
      doc.text('No upcoming due dates in the next 30 days.',margin,y+4);y+=10;
    }

    // ── Footer on every page ──
    const totalPages=doc.internal.getNumberOfPages();
    for(let p=1;p<=totalPages;p++){
      doc.setPage(p);
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(170,170,170);
      doc.text(`JobTrack Dashboard · ${dateStr}`,margin,ph-6);
      doc.text(`Page ${p} of ${totalPages}`,pw-margin,ph-6,{align:'right'});
    }

    const fname=`jobtrack-dashboard-${now.toISOString().slice(0,10)}.pdf`;
    doc.save(fname);
  } catch(e){
    console.error(e);alert('PDF export failed: '+e.message);
  } finally {
    btn.textContent='⬇ Export PDF';btn.disabled=false;
  }
}
</script>
</body>
</html>
